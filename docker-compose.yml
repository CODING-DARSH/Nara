version: "3.9"

networks:
  nara-net:
    driver: bridge

services:

  adminer:
    image: adminer:latest
    container_name: nara-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - nara-net

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: nara-auth
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      ENVIRONMENT: development
    ports:
      - "8001:8001"
    networks:
      - nara-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  user-intelligence-service:
    build:
      context: ./services/user-intelligence
      dockerfile: Dockerfile
    container_name: nara-user-intelligence
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
    ports:
      - "8002:8002"
    networks:
      - nara-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  ingestion-service:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: nara-ingestion
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      ENVIRONMENT: development
    ports:
      - "8003:8003"
    networks:
      - nara-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  ml-inference-service:
    build:
      context: ./services/ml-inference
      dockerfile: Dockerfile
    container_name: nara-ml-inference
    restart: unless-stopped
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL}
      LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SPACY_MODEL: en_core_web_sm
      FUZZY_MATCH_THRESHOLD: "80"
      ENVIRONMENT: development
    ports:
      - "8004:8004"
    networks:
      - nara-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  recommendation-service:
    build:
      context: ./services/recommendation
      dockerfile: Dockerfile
    container_name: nara-recommendation
    restart: unless-stopped
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL}
      LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      USER_INTELLIGENCE_URL: ${USER_INTELLIGENCE_URL}
      ML_INFERENCE_URL: ${ML_INFERENCE_URL}
      MODELS_DIR: /app/models
      ACTIVE_RANKER: lgbm
      ACTIVE_COLD_START: wide_deep
      ACTIVE_HEALTH_SCORER: xgb
      ACTIVE_OCCASION: xgb
      ACTIVE_REORDER: xgb
      ENVIRONMENT: development
    volumes:
      - ./services/recommendation/app:/app/app
      - ./services/ml-training/models:/app/models:ro
    ports:
      - "8005:8005"
    networks:
      - nara-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  conversation-service:
    build:
      context: ./services/conversation
      dockerfile: Dockerfile
    container_name: nara-conversation
    restart: unless-stopped
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      USER_INTELLIGENCE_URL: ${USER_INTELLIGENCE_URL}
      RECOMMENDATION_URL: ${RECOMMENDATION_URL}
      ML_INFERENCE_URL: ${ML_INFERENCE_URL}
      INTENT_MODEL: typeform/distilbert-base-uncased-mnli
      NER_MODEL: en_core_web_sm
      RESPONSE_MODEL: template
      ENVIRONMENT: development
    ports:
      - "8006:8006"
    networks:
      - nara-net
    depends_on:
      - recommendation-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 5